services:
  db:
    image: postgres:16-alpine
    container_name: resource_postgres_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auth_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_APP_USER: ${DB_APP_USER:-app_user}
      DB_APP_USER_PASSWORD: ${DB_APP_USER_PASSWORD}
      DB_APP_ADMIN: ${DB_APP_ADMIN:-app_admin}
      DB_APP_ADMIN_PASSWORD: ${DB_APP_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./DB/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-auth_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  platform_auth:
    build:
      context: ./platform_auth
      dockerfile: Dockerfile
    container_name: resource_platform_auth
    restart: always
    ports:
      - "127.0.0.1:${AUTH_PORT:-3001}:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_APP_USER:-app_user}
      DB_PASSWORD: ${DB_APP_USER_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-auth_db}
      DATABASE_URL: postgres://${DB_APP_USER:-app_user}:${DB_APP_USER_PASSWORD}@db:5432/${POSTGRES_DB:-auth_db}
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./platform_auth
      dockerfile: Dockerfile
    container_name: resource_backend
    restart: always
    ports:
      - "127.0.0.1:${AUTH_PORT:-3001}:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_APP_USER:-app_user}
      DB_PASSWORD: ${DB_APP_USER_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-auth_db}
      DATABASE_URL: postgres://${DB_APP_USER:-app_user}:${DB_APP_USER_PASSWORD}@db:5432/${POSTGRES_DB:-auth_db}
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - backend_alias

volumes:
  postgres_data:
    driver: local
